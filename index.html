<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Click Counter</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">Click Counter</h1>
    <div class="counter-display" id="counter">0</div>
    <div class="buttons">
      <button class="btn btn-minus" id="minus" aria-label="Decrease">−</button>
      <button class="btn btn-reset" id="reset" aria-label="Reset">Reset</button>
      <button class="btn btn-plus" id="plus" aria-label="Increase">+</button>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
